name: C++ CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: C++ - ${{ github.event_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure --verbose --no-compress-output

  windows:
    name: C++ Windows (MSVC, Ninja) - ${{ github.event_name }}
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # Ninja rather than the Visual Studio generator: Ninja refuses two
      # targets that write the same file, which the Visual Studio generator
      # lets through. The developer environment puts cl.exe and the Ninja that
      # ships with Visual Studio on PATH.
      - uses: ilammy/msvc-dev-cmd@v1
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure --no-compress-output
